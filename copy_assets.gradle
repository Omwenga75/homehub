task copyAssets(type: Copy) {
    from('C:/Users/USER/HomeView/app/src/main/res/drawable') {
        include '*.*'
    }
    into 'C:/Users/USER/Desktop/HomeHub/app/src/main/res/drawable'
    
    doLast {
        println "Drawables copied successfully!"
    }
}

task copyLayouts(type: Copy) {
    from('C:/Users/USER/HomeView/app/src/main/res/layout') {
        include 'activity_host_dashboard.xml'
        include 'activity_admin_login.xml'
        include 'activity_login.xml'
        include 'item_admin_property.xml'
        include 'item_host.xml'
    }
    into 'C:/Users/USER/Desktop/HomeHub/app/src/main/res/layout'
    
    doLast {
        println "Layouts copied successfully!"
    }
}

task migrateAll {
    dependsOn copyAssets, copyLayouts
    doLast {
        println "All assets migrated successfully via Gradle!"
    }
}
